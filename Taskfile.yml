# Taskfile.yml schema version - no need to change
version: '3'

vars:
  name: '{{.name | default "alx"}}'
  title: '{{.title | default "Aetherlux"}}'
  build: '{{.build | default "Debug"}}'

  # Appends .exe on Windows
  exe: '{{if eq .OS "Windows_NT"}}.exe{{end}}'

  assets_dir: assets
  assets_headers_dir: src/assets
  toolchain_src_dir: toolchain/src
  pack_assets_script_src: toolchain/src/pack_assets.cr
  pack_assets_bin: 'build/pack_assets{{.exe}}'

# File watching/globbing references used across tasks
interval: 500ms

# Suppresses show commands globally for all tasks in this Taskfile
silent: true

# Always prefixes every line with [task-name] (so deps, and cmds look alike)
output: 'prefixed'

tasks:
  # ==========================================
  # DEFAULT WORKFLOW
  # ==========================================
  default:
    desc: Pack assets, build Debug and run game executable
    cmds:
      - task: build
      - task: run

  # ==========================================
  # ASSET PACKER TOOL BUILD
  # ==========================================
  pack-assets-bin:
    desc: Build pack assets executable
    run: once
    method: timestamp
    sources:
      - '{{.pack_assets_script_src}}'
      - '{{.toolchain_src_dir}}/**/*.cr'
    generates:
      - '{{.pack_assets_bin}}'
    cmds:
      - echo "=> Building pack assets executable..."
      - mkdir -p build
      - crystal build {{.pack_assets_script_src}} -o {{.pack_assets_bin}}

  # ==========================================
  # ASSET PIPELINES
  # ==========================================
  assets:
    desc: Pack assets
    cmds:
      - task: pack-assets-bin
      - task: assets-parallel

  assets-parallel:
    internal: true
    deps:
      - fonts
      - images
      - music

  fonts:
    desc: Pack font assets
    deps:
      - pack-assets-bin
    method: timestamp
    sources:
      - '{{.assets_dir}}/fonts/**/*'
    generates:
      - '{{.assets_headers_dir}}/Fonts.h'
    cmds:
      - '{{.pack_assets_bin}} --only=fonts'

  images:
    desc: Pack image assets
    deps:
      - pack-assets-bin
    method: timestamp
    sources:
      - '{{.assets_dir}}/images/**/*'
    generates:
      - '{{.assets_headers_dir}}/Images.h'
    cmds:
      - '{{.pack_assets_bin}} --only=images'

  music:
    desc: Pack music assets
    deps:
      - pack-assets-bin
    method: timestamp
    sources:
      - '{{.assets_dir}}/music/**/*'
    generates:
      - '{{.assets_headers_dir}}/Music.h'
    cmds:
      - '{{.pack_assets_bin}} --only=music'

  # ==========================================
  # SUBMODULE MANAGEMENT
  # ==========================================
  submodules:
    desc: Ensure git submodules are initialized and up-to-date
    status:
      - test -z "$(git submodule status --recursive | grep -E '^[+-U]')"
    cmds:
      - echo "=> Updating out-of-date git submodules..."
      - git submodule update --init --recursive

  # ==========================================
  # C++ BUILD CONFIG (CMake)
  # ==========================================
  cmake-build-config:
    desc: Create CMake config build files
    internal: true
    vars:
      build_dir: 'build/{{.build}}'
    sources:
      - 'CMakeLists.txt'
    generates:
      - '{{.build_dir}}/CMakeCache.txt'
      - '{{.build_dir}}/CMakeFiles/TargetDirectories.txt'
    cmds:
      - echo "=> Configuring ({{.build}}) CMake..."
      # If Ninja exists on system, use -G Ninja, otherwise fall back to CMake's default
      - cmd: |
          powershell -Command "
            if (Get-Command ninja -ErrorAction SilentlyContinue) {
              cmake -B {{.build_dir}} -G Ninja -DCMAKE_BUILD_TYPE={{.build}} -DGAME_BIN={{.name}}
            } else {
              Write-Host '[NOTE] Ninja generator not found. Falling back to default generator.' -ForegroundColor Yellow;
              Write-Host '       For faster & consistent builds, see README to install Ninja.' -ForegroundColor Yellow;
              cmake -B {{.build_dir}} -DCMAKE_BUILD_TYPE={{.build}} -DGAME_BIN={{.name}}
            }
          "
        platforms: [windows]
      - cmd: |
          if command -v ninja >/dev/null 2>&1; then
            cmake -B {{.build_dir}} -G Ninja -DCMAKE_BUILD_TYPE={{.build}} -DGAME_BIN={{.name}}
          else
            echo "\033[0;33m[NOTE] Ninja generator not found. Falling back to default generator.\033[0m"
            echo "\033[0;33m       For faster & consistent builds, see README to install Ninja.\033[0m"
            cmake -B {{.build_dir}} -DCMAKE_BUILD_TYPE={{.build}} -DGAME_BIN={{.name}}
          fi
        platforms: [linux, darwin]

  # ==========================================
  # C++ BUILD (CMake)
  # ==========================================
  build:
    desc: Pack assets, build game executable
    vars:
      build_dir: 'build/{{.build}}'
      binary: '{{.build_dir}}/{{.name}}{{.exe}}'
    deps:
      - submodules
      - assets
    cmds:
      - task: cmake-build-config
        vars: { build: '{{.build}}' }
      - echo "=> Building ({{.build}}) game executable..."
      - cmake --build {{.build_dir}} -j

  # ==========================================
  # RUN
  # ==========================================
  run:
    desc: Run Debug game executable
    interactive: true
    silent: true
    deps:
      - build
    vars:
      build_dir: 'build/{{.build}}'
      binary: '{{.build_dir}}/{{.name}}{{.exe}}'
    cmds:
      - echo "=> Running {{.build}} {{.name}}..."
      - ./{{.binary}}

  # ==========================================
  # CLEAN BUILD FOLDER OR ASSET HEADERS
  # ==========================================
  clean:
    desc: Clean build
    vars:
      build_dir: 'build/{{.build}}'
    cmds:
      - echo "=> Cleaning {{.build_dir}} folder..."
      - rm -rf "{{.build_dir}}"
      - rm -rf .task
      - task: clean-assets

  clean-assets:
    desc: Clean generated asset headers
    cmds:
      - task: clean-fonts
      - task: clean-images
      - task: clean-music

  clean-fonts:
    desc: Clean generated Fonts.h header
    cmds:
      - echo "=> Cleaning Fonts.h..."
      - rm -f '{{.assets_headers_dir}}/Fonts.h'

  clean-images:
    desc: Clean generated Images.h header
    cmds:
      - echo "=> Cleaning Images.h..."
      - rm -f '{{.assets_headers_dir}}/Images.h'

  clean-music:
    desc: Clean generated Music.h header
    cmds:
      - echo "=> Cleaning Music.h..."
      - rm -f '{{.assets_headers_dir}}/Music.h'

  clean-pack-assets-bin:
    desc: Clean pack assets executable
    cmds:
      - echo "=> Cleaning pack assets executable..."
      - rm -f '{{.pack_assets_bin}}'*

  # ==========================================
  # CMAKE RECONFIG / RESET SHORTCUTS
  # ==========================================
  reconfig:
    desc: Reconfigure CMake from scratch (--fresh)
    vars:
      build_dir: 'build/{{.build}}'
    cmds:
      - echo "=> Reconfiguring ({{.build}}) CMake..."
      # If Ninja exists on system, use -G Ninja, otherwise fall back to CMake's default
      # NOTE: same as cmake-build-config but with --fresh (TODO: refactor to share task later!)
      - cmd: |
          powershell -Command "
            if (Get-Command ninja -ErrorAction SilentlyContinue) {
              cmake -B {{.build_dir}} -G Ninja -DCMAKE_BUILD_TYPE={{.build}} -DGAME_BIN={{.name}}
            } else {
              Write-Host '[NOTE] Ninja generator not found. Falling back to default generator.' -ForegroundColor Yellow;
              Write-Host '       For faster & consistent builds, see README to install Ninja.' -ForegroundColor Yellow;
              cmake -B {{.build_dir}} -DCMAKE_BUILD_TYPE={{.build}} -DGAME_BIN={{.name}} --fresh
            }
          "
        platforms: [windows]
      - cmd: |
          if command -v ninja >/dev/null 2>&1; then
            cmake -B {{.build_dir}} -G Ninja -DCMAKE_BUILD_TYPE={{.build}} -DGAME_BIN={{.name}}
          else
            echo "\033[0;33m[NOTE] Ninja generator not found. Falling back to default generator.\033[0m"
            echo "\033[0;33m       For faster & consistent builds, see README to install Ninja.\033[0m"
            cmake -B {{.build_dir}} -DCMAKE_BUILD_TYPE={{.build}} -DGAME_BIN={{.name}} --fresh
          fi
        platforms: [linux, darwin]

  reset:
    desc: Clean build and reconfigure CMake
    cmds:
      - task: clean
        vars: { build: '{{.build}}' }
      - task: reconfig
        vars: { build: '{{.build}}' }

  # ==========================================
  # RELEASE CONVENIENCE SHORTCUTS
  # ==========================================
  build-release:
    desc: Pack assets, build Release game executable
    cmds:
      - task: build
        vars: { build: Release }

  run-release:
    desc: Run Release game executable
    interactive: true
    silent: true
    cmds:
      - task: run
        vars: { build: Release }

  clean-release:
    desc: Clean Release build
    cmds:
      - task: clean
        vars: { build: Release }

  clean-all:
    desc: Clean Debug, Release builds and pack assets executable
    cmds:
      - task: clean
        vars: { build: Debug }
      - task: clean
        vars: { build: Release }
      - task: clean-pack-assets-bin

  reconfig-release:
    desc: Reconfigure Release CMake from scratch (--fresh)
    cmds:
      - task: reconfig
        vars: { build: Release }

  reset-release:
    desc: Clean Release build and reconfigure CMake
    cmds:
      - task: reset
        vars: { build: Release }

  size-release:
    desc: Calcs size of Release executable
    vars:
      build: Release
      build_dir: 'build/{{.build}}'
      binary: '{{.build_dir}}/{{.name}}{{.exe}}'
    cmds:
      - cmd: |
          echo '=> Executable size: {{.binary}}'
          ls -lah '{{.binary}}'
        platforms: [windows]
      - cmd: |
          echo "=> Executable size: {{.binary}}"
          du -h '{{.binary}}'
        platforms: [linux, darwin]

  release:
    desc: Pack assets, build Release and run game executable
    cmds:
      - task: build-release
      - task: size-release
      - task: run-release
