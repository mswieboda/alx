# Taskfile.yml schema version - no need to change
version: '3'

vars:
  name: '{{.name | default "alx"}}'
  title: '{{.title | default "Aetherlux"}}'
  build: '{{.build | default "Debug"}}'

  # Appends .exe on Windows
  exe: '{{if eq .OS "Windows_NT"}}.exe{{end}}'

  assets_dir: assets
  assets_headers_dir: src/assets
  pack_assets_script_src: toolchain/src/pack_assets.cr
  pack_assets_bin: 'build/pack_assets{{.exe}}'

# File watching/globbing references used across tasks
interval: 500ms

# Suppresses show commands globally for all tasks in this Taskfile
silent: true

# Always prefixes every line with [task-name] (so deps, and cmds look alike)
output: 'prefixed'

tasks:
  # ==========================================
  # DEFAULT WORKFLOW
  # ==========================================
  default:
    desc: Build assets, compile game, and run
    cmds:
      - task: build
      - task: run

  # ==========================================
  # ASSET PACKER TOOL BUILD
  # ==========================================
  pack-assets-bin:
    desc: Build the asset packing tool executable
    run: once
    sources:
      - '{{.pack_assets_script_src}}'
      - 'toolchain/src/**/*.cr'
    generates:
      - '{{.pack_assets_bin}}'
    cmds:
      - echo "=> Building pack assets script..."
      - mkdir -p build
      - crystal build {{.pack_assets_script_src}} -o {{.pack_assets_bin}}

  # ==========================================
  # ASSET PIPELINES
  # ==========================================
  assets:
    desc: Pack all asset pipelines conditionally
    cmds:
      - task: pack-assets-bin
      - task: assets-parallel

  assets-parallel:
    internal: true
    deps:
      - fonts
      - images
      - music

  fonts:
    desc: Pack font assets
    deps:
      - pack-assets-bin
    sources:
      - '{{.assets_dir}}/fonts/**/*'
    generates:
      - '{{.assets_headers_dir}}/Fonts.h'
    cmds:
      - '{{.pack_assets_bin}} -- --only=fonts'

  images:
    desc: Pack image assets
    deps:
      - pack-assets-bin
    sources:
      - '{{.assets_dir}}/images/**/*'
    generates:
      - '{{.assets_headers_dir}}/Images.h'
    cmds:
      - '{{.pack_assets_bin}} -- --only=images'

  music:
    desc: Pack music assets
    deps:
      - pack-assets-bin
    sources:
      - '{{.assets_dir}}/music/**/*'
    generates:
      - '{{.assets_headers_dir}}/Music.h'
    cmds:
      - '{{.pack_assets_bin}} --only=music'

  # ==========================================
  # SUBMODULE SANITY CHECK
  # ==========================================
  check-deps:
    desc: Verify git submodules are checked out
    internal: true
    preconditions:
      - msg: "Missing submodule 'deps/minifb'. Please run: git submodule update --init --recursive"
        sh: test -e deps/minifb/.git
      - msg: "Missing submodule 'deps/miniaudio'. Please run: git submodule update --init --recursive"
        sh: test -e deps/miniaudio/.git
      - msg: "Missing submodule 'deps/pocketmod'. Please run: git submodule update --init --recursive"
        sh: test -e deps/pocketmod/.git

  # ==========================================
  # C++ BUILD CONFIG (CMake)
  # ==========================================
  cmake-build-config:
    desc: Create CMake config build files
    internal: true
    vars:
      build_dir: 'build/{{.build}}'
    sources:
      - 'CMakeLists.txt'
    generates:
      - '{{.build_dir}}/CMakeCache.txt'
      - '{{.build_dir}}/CMakeFiles/TargetDirectories.txt'
    cmds:
      - echo "=> Configuring ({{.build}}) CMake..."
      # If Ninja exists on system, use -G Ninja, otherwise fall back to CMake's default
      - cmd: |
          powershell -Command "
            if (Get-Command ninja -ErrorAction SilentlyContinue) {
              cmake -B {{.build_dir}} -G Ninja -DCMAKE_BUILD_TYPE={{.build}} -DGAME_BIN={{.name}}
            } else {
              Write-Host '[NOTE] Ninja generator not found. Falling back to default generator.' -ForegroundColor Yellow;
              Write-Host '       For faster & consistent builds, see README to install Ninja.' -ForegroundColor Yellow;
              cmake -B {{.build_dir}} -DCMAKE_BUILD_TYPE={{.build}} -DGAME_BIN={{.name}}
            }
          "
        platforms: [windows]
      - cmd: |
          if command -v ninja >/dev/null 2>&1; then
            cmake -B {{.build_dir}} -G Ninja -DCMAKE_BUILD_TYPE={{.build}} -DGAME_BIN={{.name}}
          else
            echo "\033[0;33m[NOTE] Ninja generator not found. Falling back to default generator.\033[0m"
            echo "\033[0;33m       For faster & consistent builds, see README to install Ninja.\033[0m"
            cmake -B {{.build_dir}} -DCMAKE_BUILD_TYPE={{.build}} -DGAME_BIN={{.name}}
          fi
        platforms: [linux, darwin]

  # ==========================================
  # C++ BUILD (CMake)
  # ==========================================
  build:
    desc: Build game executable
    vars:
      build_dir: 'build/{{.build}}'
      binary: '{{.build_dir}}/{{.name}}{{.exe}}'
    sources:
      - 'src/**/*'
      - 'CMakeLists.txt'
    generates:
      - '{{.binary}}'
    cmds:
      - task: check-deps
      - task: cmake-build-config
        vars: { build: '{{.build}}' }
      - task: assets
      - echo "=> Building ({{.build}}) game executable..."
      - cmake --build {{.build_dir}} -j

  # ==========================================
  # RUN
  # ==========================================
  run:
    desc: Run game
    interactive: true
    silent: true
    vars:
      build_dir: 'build/{{.build}}'
      binary: '{{.build_dir}}/{{.name}}{{.exe}}'
    cmds:
      - echo "=> Running {{.build}} {{.name}}..."
      - ./{{.binary}}

  # ==========================================
  # CLEAN BUILD FOLDER OR ASSET HEADERS
  # ==========================================
  clean:
    vars:
      build_dir: 'build/{{.build}}'
    cmds:
      - echo "=> Cleaning {{.build_dir}} folder..."
      - rm -rf "{{.build_dir}}"
      - task: clean-assets

  clean-assets:
    desc: Clean all generated asset headers
    cmds:
      - task: clean-fonts
      - task: clean-images
      - task: clean-music

  clean-fonts:
    desc: Clean generated Fonts.h header
    cmds:
      - echo "=> Cleaning Fonts.h..."
      - rm -f '{{.assets_headers_dir}}/Fonts.h'

  clean-images:
    desc: Clean generated Images.h header
    cmds:
      - echo "=> Cleaning Images.h..."
      - rm -f '{{.assets_headers_dir}}/Images.h'

  clean-music:
    desc: Clean generated Music.h header
    cmds:
      - echo "=> Cleaning Music.h..."
      - rm -f '{{.assets_headers_dir}}/Music.h'

  # ==========================================
  # CMAKE RECONFIG / RESET SHORTCUTS
  # ==========================================
  reconfig:
    desc: Reconfigure CMake from scratch (--fresh)
    vars:
      build_dir: 'build/{{.build}}'
    cmds:
      - echo "=> Reconfiguring ({{.build}}) CMake..."
      # If Ninja exists on system, use -G Ninja, otherwise fall back to CMake's default
      # NOTE: same as cmake-build-config but with --fresh (TODO: refactor to share task later!)
      - cmd: |
          powershell -Command "
            if (Get-Command ninja -ErrorAction SilentlyContinue) {
              cmake -B {{.build_dir}} -G Ninja -DCMAKE_BUILD_TYPE={{.build}} -DGAME_BIN={{.name}}
            } else {
              Write-Host '[NOTE] Ninja generator not found. Falling back to default generator.' -ForegroundColor Yellow;
              Write-Host '       For faster & consistent builds, see README to install Ninja.' -ForegroundColor Yellow;
              cmake -B {{.build_dir}} -DCMAKE_BUILD_TYPE={{.build}} -DGAME_BIN={{.name}} --fresh
            }
          "
        platforms: [windows]
      - cmd: |
          if command -v ninja >/dev/null 2>&1; then
            cmake -B {{.build_dir}} -G Ninja -DCMAKE_BUILD_TYPE={{.build}} -DGAME_BIN={{.name}}
          else
            echo "\033[0;33m[NOTE] Ninja generator not found. Falling back to default generator.\033[0m"
            echo "\033[0;33m       For faster & consistent builds, see README to install Ninja.\033[0m"
            cmake -B {{.build_dir}} -DCMAKE_BUILD_TYPE={{.build}} -DGAME_BIN={{.name}} --fresh
          fi
        platforms: [linux, darwin]

  reset:
    desc: Wipe build folder and reconfigure CMake
    cmds:
      - task: clean
        vars: { build: '{{.build}}' }
      - task: reconfig
        vars: { build: '{{.build}}' }

  # ==========================================
  # RELEASE CONVENIENCE SHORTCUTS
  # ==========================================
  build-release:
    desc: Build game executable in Release mode
    cmds:
      - task: build
        vars: { build: Release }
      - task: pack-bin
        vars: { build: Release }

  run-release:
    desc: Run game executable in Release mode
    interactive: true
    silent: true
    cmds:
      - task: run
        vars: { build: Release }

  clean-release:
    desc: Clean Release build directory
    cmds:
      - task: clean
        vars: { build: Release }

  release:
    desc: Build and run the release executable
    cmds:
      - task: build-release
      - task: run-release

  # ==========================================
  # BINARY PACKING (UPX)
  # ==========================================
  pack-bin:
    desc: Compress release binary with UPX
    internal: true
    vars:
      build_dir: 'build/{{.build}}'
      binary: '{{.build_dir}}/{{.name}}{{.exe}}'
    # sources:
    #   - '{{.binary}}'
    # If 'upx -t' succeeds (returns 0), the binary is ALREADY compressed, so skip task!
    status:
      - '{{if eq .OS "windows"}}powershell -NoProfile -Command "if (Get-Command upx -ErrorAction SilentlyContinue) { & upx -t \"{{.binary}}\" *> $null; if ($LASTEXITCODE -eq 0) { exit 0 } }; exit 1"{{else}}sh -c "command -v upx >/dev/null 2>&1 && upx -t \"{{.binary}}\" >/dev/null 2>&1"{{end}}'
    cmds:
      # Windows execution
      - cmd: |
          powershell -Command "
            if (Get-Command upx -ErrorAction SilentlyContinue) {
              Write-Host '=> Compressing binary with UPX (--ultra-brute)...' -ForegroundColor Cyan;
              upx --ultra-brute '{{.binary}}';
            } else {
              Write-Host '[NOTE] UPX not found. Skipping binary compression.' -ForegroundColor Yellow;
              Write-Host '       For significantly smaller executable size, see README to install UPX.' -ForegroundColor Yellow;
            }
          "
        platforms: [windows]
      # macOS / Linux execution
      - cmd: |
          if command -v upx >/dev/null 2>&1; then
            echo "\033[0;36m=> Compressing binary with UPX (--ultra-brute)...\033[0m"
            upx --ultra-brute "{{.binary}}"
            # On macOS, re-sign the compressed Mach-O binary to satisfy ARM64 SIP requirements
            if [ "$(uname)" = "Darwin" ]; then
              echo "\033[0;36m=> Re-signing Mach-O binary for macOS ARM64...\033[0m"
              codesign --force --deep -s - "{{.binary}}"
            fi
          else
            echo "\033[0;33m[NOTE] UPX not found. Skipping binary compression.\033[0m"
            echo "\033[0;33m       For significantly smaller executable size, see README to install UPX.\033[0m"
          fi
        platforms: [linux, darwin]
